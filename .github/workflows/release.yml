name: Release Stealth

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Stealth.sln
      - name: Build Release
        run: dotnet build Stealth.sln --configuration Release --no-restore
      - name: Test Release and WPF raster output
        env:
          STEALTH_VISUAL_TEST_DIR: ${{ github.workspace }}\\visual-regression
        run: dotnet test Stealth.sln --configuration Release --no-build
      - name: Upload visual regression sample
        uses: actions/upload-artifact@v4
        with:
          name: Stealth-rendered-title
          path: visual-regression/*.png
          if-no-files-found: error
      - name: Package and smoke test single EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Get-ChildItem 'Stealth/bin/Release' -Filter Stealth.exe -Recurse -File | Select-Object -First 1
          if (-not $app) { throw 'Stealth.exe not built' }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $app.FullName release/Stealth.exe
          $probe = Join-Path $env:RUNNER_TEMP 'stealth-single-exe-test'
          New-Item -ItemType Directory -Force $probe | Out-Null
          Copy-Item release/Stealth.exe (Join-Path $probe 'Stealth.exe') -Force
          $process = $null
          try {
            $process = Start-Process (Join-Path $probe 'Stealth.exe') -PassThru
            Start-Sleep -Seconds 3
            $process.Refresh()
            if ($process.HasExited) { throw "Standalone EXE exited unexpectedly: $($process.ExitCode)" }
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              [void]$process.WaitForExit(10000)
            }
            # Windows can retain the image section briefly after process termination.
            # Best-effort cleanup should never invalidate a successful smoke test.
            for ($attempt = 0; $attempt -lt 5; $attempt++) {
              try {
                Remove-Item $probe -Recurse -Force -ErrorAction Stop
                break
              } catch {
                Start-Sleep -Milliseconds 400
              }
            }
          }
          $sha = (Get-FileHash release/Stealth.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/release/SHA256SUMS.txt", "$sha  Stealth.exe`n")
      - uses: actions/upload-artifact@v4
        with:
          name: Stealth-single-exe-release
          path: release/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Stealth-single-exe-release
          path: release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f release/Stealth.exe
          (cd release && sha256sum -c SHA256SUMS.txt)
          gh release create v1.0 release/Stealth.exe release/SHA256SUMS.txt \
            --title "Stealth 1.0" --target "$GITHUB_SHA" --notes-file RELEASE_NOTES_1.0.md --latest
